<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 230" width="840" height="230">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141321"/>
      <stop offset="100%" stop-color="#1a182c"/>
    </linearGradient>
    <linearGradient id="codexGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10a37f" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#10a37f" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="agyGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="agyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4285f4"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="claudeGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eb6b2c" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#eb6b2c" stop-opacity="0"/>
    </linearGradient>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      @keyframes bobCodex {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-3px); }
      }
      @keyframes floatAgy {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-7px); }
      }
      @keyframes bobClawd {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-3px); }
      }
      @keyframes cursorBlink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes pulseDot {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.35; }
      }
      @keyframes spinSlow {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .codex-body { animation: bobCodex 2.3s ease-in-out infinite; }
      .agy-body { animation: floatAgy 2.8s ease-in-out infinite; }
      .clawd-body { animation: bobClawd 2.1s ease-in-out infinite; }
      .cursor { animation: cursorBlink 1s step-end infinite; }
      .pulse { animation: pulseDot 1.8s ease-in-out infinite; }
      .orbit { transform-box: fill-box; transform-origin: center; animation: spinSlow 9s linear infinite; }
    </style>
  </defs>

  <!-- Card background -->
  <rect x="1" y="1" width="838" height="228" rx="14" fill="url(#bgGrad)" stroke="#2e2c48" stroke-width="2"/>

  <!-- Window header -->
  <rect x="1" y="1" width="838" height="32" rx="14" fill="#1e1c30"/>
  <rect x="1" y="20" width="838" height="13" fill="#1e1c30"/>
  <circle cx="24" cy="17" r="5.5" fill="#ff5f56"/>
  <circle cx="42" cy="17" r="5.5" fill="#ffbd2e"/>
  <circle cx="60" cy="17" r="5.5" fill="#27c93f"/>
  <text x="420" y="21" text-anchor="middle" fill="#8b88a8" font-size="12" class="mono">vibe-coding.sh — codex (main) • antigravity • claude code</text>

  <!-- Ambient glows -->
  <ellipse cx="145" cy="174" rx="105" ry="26" fill="url(#codexGlow)"/>
  <ellipse cx="420" cy="174" rx="105" ry="26" fill="url(#agyGlow)"/>
  <ellipse cx="695" cy="174" rx="105" ry="26" fill="url(#claudeGlow)"/>

  <!-- ==================== 1. CODEX (MAIN AI) ==================== -->
  <!-- MAIN badge -->
  <rect x="44" y="48" width="76" height="19" rx="9.5" fill="#10a37f" opacity="0.2" stroke="#10a37f" stroke-width="1"/>
  <text x="82" y="61" text-anchor="middle" fill="#34d399" font-size="10" font-weight="bold" class="mono">★ MAIN AI</text>

  <!-- Chair -->
  <rect x="42" y="108" width="10" height="54" rx="4" fill="#2c2942"/>
  <rect x="45" y="158" width="34" height="7" rx="3" fill="#2c2942"/>

  <!-- Codex bot sitting -->
  <g class="codex-body">
    <rect x="74" y="152" width="20" height="9" rx="4" fill="#0d8265"/>
    <rect x="88" y="154" width="9" height="15" rx="4" fill="#0d8265"/>
    <rect x="60" y="102" width="40" height="40" rx="11" fill="#10a37f"/>
    <line x1="80" y1="102" x2="80" y2="91" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="80" cy="89" r="3.5" fill="#38bdf8"/>
    <rect x="67" y="113" width="28" height="12" rx="4" fill="#11101b"/>
    <circle cx="75" cy="119" r="2.6" fill="#38bdf8"/>
    <circle cx="87" cy="119" r="2.6" fill="#38bdf8"/>
    <rect x="94" y="131" width="24" height="8" rx="4" fill="#1bc49a"/>
  </g>

  <!-- Codex Monitor -->
  <rect x="126" y="102" width="110" height="64" rx="7" fill="#252338" stroke="#10a37f" stroke-width="1.5"/>
  <rect x="132" y="108" width="98" height="52" rx="4" fill="#11101b"/>
  <text x="138" y="121" fill="#10a37f" font-size="10" font-weight="bold" class="mono">codex &gt;_</text>
  <rect x="138" y="128" width="68" height="4" rx="2" fill="#38bdf8" opacity="0.85"/>
  <rect x="138" y="137" width="48" height="4" rx="2" fill="#6e6a8f"/>
  <rect x="138" y="146" width="76" height="4" rx="2" fill="#10a37f" opacity="0.85"/>
  <rect x="219" y="145" width="5.5" height="7" fill="#10a37f" class="cursor"/>
  <rect x="173" y="166" width="14" height="6" fill="#3a3756"/>
  <rect x="34" y="172" width="218" height="6" rx="3" fill="#3d3a5c"/>

  <!-- ==================== 2. ANTIGRAVITY ==================== -->
  <text x="420" y="61" text-anchor="middle" fill="#c084fc" font-size="10.5" font-weight="bold" class="mono">ANTIGRAVITY</text>

  <!-- Floating Antigravity Core -->
  <g class="agy-body">
    <ellipse cx="348" cy="128" rx="24" ry="8" fill="none" stroke="url(#agyGrad)" stroke-width="2" class="orbit"/>
    <circle cx="348" cy="128" r="15" fill="url(#agyGrad)"/>
    <path d="M348 117 L354 128 L348 139 L342 128 Z" fill="#141321" opacity="0.85"/>
    <circle cx="348" cy="128" r="3" fill="#ffffff"/>
    <!-- Little floating spark -->
    <circle cx="326" cy="108" r="2.5" fill="#38bdf8"/>
    <circle cx="370" cy="144" r="2" fill="#c084fc"/>
  </g>

  <!-- Antigravity Monitor -->
  <rect x="392" y="102" width="118" height="64" rx="7" fill="#252338" stroke="#a855f7" stroke-width="1.5"/>
  <rect x="398" y="108" width="106" height="52" rx="4" fill="#11101b"/>
  <text x="404" y="121" fill="#c084fc" font-size="9.5" font-weight="bold" class="mono">antigravity &gt;_</text>
  <rect x="404" y="128" width="84" height="4" rx="2" fill="url(#agyGrad)"/>
  <rect x="404" y="137" width="56" height="4" rx="2" fill="#6e6a8f"/>
  <rect x="404" y="146" width="70" height="4" rx="2" fill="#38bdf8" opacity="0.8"/>
  <rect x="480" y="145" width="5.5" height="7" fill="#c084fc" class="cursor"/>
  <rect x="444" y="166" width="14" height="6" fill="#3a3756"/>
  <rect x="308" y="172" width="222" height="6" rx="3" fill="#3d3a5c"/>

  <!-- ==================== 3. CLAUDE CODE (ACCURATE CLAWD) ==================== -->
  <text x="695" y="61" text-anchor="middle" fill="#fb923c" font-size="10.5" font-weight="bold" class="mono">CLAUDE CODE</text>

  <!-- Accurate blocky pixel Clawd mascot with Deal-With-It sunglasses + flag -->
  <g class="clawd-body">
    <!-- 4 pixel legs -->
    <rect x="596" y="156" width="7" height="14" fill="#d95b26"/>
    <rect x="608" y="156" width="7" height="14" fill="#d95b26"/>
    <rect x="625" y="156" width="7" height="14" fill="#d95b26"/>
    <rect x="637" y="156" width="7" height="14" fill="#d95b26"/>
    <!-- Left & Right pixel arms -->
    <rect x="583" y="130" width="10" height="13" fill="#eb6b2c"/>
    <rect x="647" y="130" width="10" height="13" fill="#eb6b2c"/>
    <!-- Main blocky orange body -->
    <rect x="593" y="116" width="54" height="40" fill="#eb6b2c"/>
    <!-- Pixel Deal-With-It sunglasses -->
    <rect x="593" y="123" width="54" height="4" fill="#111111"/>
    <rect x="598" y="127" width="18" height="8" fill="#111111"/>
    <rect x="624" y="127" width="18" height="8" fill="#111111"/>
    <!-- Pixel glare on glasses -->
    <rect x="601" y="128" width="3" height="3" fill="#ffffff"/>
    <rect x="605" y="131" width="3" height="3" fill="#d1d5db"/>
    <rect x="627" y="128" width="3" height="3" fill="#ffffff"/>
    <rect x="631" y="131" width="3" height="3" fill="#d1d5db"/>

    <!-- Flag in right hand: "You're Right" -->
    <line x1="655" y1="134" x2="670" y2="82" stroke="#9ca3af" stroke-width="2" stroke-linecap="round"/>
    <polygon points="670,82 722,92 714,116 664,106" fill="#11101b" stroke="#eb6b2c" stroke-width="1"/>
    <text x="692" y="99" text-anchor="middle" fill="#fb923c" font-size="7.5" font-weight="bold" class="mono" transform="rotate(11 692 99)">You're</text>
    <text x="690" y="108" text-anchor="middle" fill="#fb923c" font-size="7.5" font-weight="bold" class="mono" transform="rotate(11 690 108)">Right!</text>
  </g>

  <!-- Claude Monitor -->
  <rect x="696" y="108" width="104" height="58" rx="7" fill="#252338" stroke="#eb6b2c" stroke-width="1.5"/>
  <rect x="702" y="114" width="92" height="46" rx="4" fill="#11101b"/>
  <text x="708" y="126" fill="#fb923c" font-size="9.5" font-weight="bold" class="mono">claude &gt;_</text>
  <rect x="708" y="133" width="58" height="4" rx="2" fill="#6e6a8f"/>
  <rect x="708" y="142" width="72" height="4" rx="2" fill="#eb6b2c" opacity="0.85"/>
  <rect x="784" y="141" width="5.5" height="7" fill="#fb923c" class="cursor"/>
  <rect x="741" y="166" width="14" height="6" fill="#3a3756"/>
  <rect x="578" y="172" width="228" height="6" rx="3" fill="#3d3a5c"/>

  <!-- Bottom status bar -->
  <circle cx="28" cy="206" r="4.5" fill="#27c93f" class="pulse"/>
  <text x="40" y="210" fill="#c5c2db" font-size="11.5" class="mono">vibe coding mode: ON</text>
  <text x="812" y="210" text-anchor="end" fill="#8b88a8" font-size="11.5" class="mono">main: Codex • Antigravity • Claude Code</text>
</svg>
