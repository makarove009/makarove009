<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="800" height="220">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141321"/>
      <stop offset="100%" stop-color="#1a182c"/>
    </linearGradient>
    <linearGradient id="claudeGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d97757" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#d97757" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="codexGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10a37f" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#10a37f" stop-opacity="0"/>
    </linearGradient>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      @keyframes bobClaude {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-3px); }
      }
      @keyframes bobCodex {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-4px); }
      }
      @keyframes blink {
        0%, 45%, 55%, 100% { transform: scaleY(1); }
        50% { transform: scaleY(0.1); }
      }
      @keyframes cursorBlink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes steam {
        0% { transform: translateY(0px); opacity: 0.7; }
        100% { transform: translateY(-12px); opacity: 0; }
      }
      @keyframes floatUp {
        0%, 100% { transform: translateY(0px); opacity: 0.5; }
        50% { transform: translateY(-7px); opacity: 1; }
      }
      @keyframes pulseDot {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.35; }
      }
      .claude-body { animation: bobClaude 2.2s ease-in-out infinite; }
      .codex-body { animation: bobCodex 2.6s ease-in-out infinite; }
      .eye-blink { transform-box: fill-box; transform-origin: center; animation: blink 4s infinite; }
      .cursor { animation: cursorBlink 1s step-end infinite; }
      .steam1 { animation: steam 2.2s ease-out infinite; }
      .steam2 { animation: steam 2.2s ease-out 1.1s infinite; }
      .float1 { animation: floatUp 3s ease-in-out infinite; }
      .float2 { animation: floatUp 3.5s ease-in-out 0.8s infinite; }
      .pulse { animation: pulseDot 1.8s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Card background -->
  <rect x="1" y="1" width="798" height="218" rx="14" fill="url(#bgGrad)" stroke="#2e2c48" stroke-width="2"/>

  <!-- Window header -->
  <rect x="1" y="1" width="798" height="32" rx="14" fill="#1e1c30"/>
  <rect x="1" y="20" width="798" height="13" fill="#1e1c30"/>
  <circle cx="24" cy="17" r="5.5" fill="#ff5f56"/>
  <circle cx="42" cy="17" r="5.5" fill="#ffbd2e"/>
  <circle cx="60" cy="17" r="5.5" fill="#27c93f"/>
  <text x="400" y="21" text-anchor="middle" fill="#8b88a8" font-size="12" class="mono">vibe-coding.sh — claude code &amp; codex</text>

  <!-- Ambient glows -->
  <ellipse cx="220" cy="170" rx="120" ry="30" fill="url(#claudeGlow)"/>
  <ellipse cx="580" cy="170" rx="120" ry="30" fill="url(#codexGlow)"/>

  <!-- LEFT: CLAUDE CODE SITTING AT DESK -->
  <!-- Chair back -->
  <rect x="92" y="102" width="12" height="58" rx="5" fill="#2c2942"/>
  <rect x="96" y="156" width="38" height="8" rx="4" fill="#2c2942"/>

  <!-- Claude mascot sitting -->
  <g class="claude-body">
    <!-- Legs sitting -->
    <rect x="128" y="150" width="22" height="10" rx="4" fill="#b85d43"/>
    <rect x="144" y="152" width="10" height="16" rx="4" fill="#b85d43"/>
    <!-- Body/Head (Claude orange crab/pixel style) -->
    <rect x="112" y="96" width="44" height="44" rx="10" fill="#d97757"/>
    <!-- Little ears/horns -->
    <rect x="116" y="88" width="10" height="10" rx="3" fill="#d97757"/>
    <rect x="142" y="88" width="10" height="10" rx="3" fill="#d97757"/>
    <!-- Eyes -->
    <rect x="124" y="112" width="6" height="8" rx="2" fill="#141321" class="eye-blink"/>
    <rect x="140" y="112" width="6" height="8" rx="2" fill="#141321" class="eye-blink"/>
    <!-- Arm reaching to keyboard -->
    <rect x="150" y="128" width="26" height="9" rx="4" fill="#e58a6c"/>
  </g>

  <!-- Claude Laptop / Monitor -->
  <rect x="186" y="96" width="112" height="68" rx="7" fill="#252338" stroke="#d97757" stroke-width="1.5"/>
  <rect x="192" y="102" width="100" height="56" rx="4" fill="#11101b"/>
  <!-- Screen code lines -->
  <text x="199" y="116" fill="#d97757" font-size="10" font-weight="bold" class="mono">claude &gt;_</text>
  <rect x="199" y="124" width="62" height="4" rx="2" fill="#6e6a8f"/>
  <rect x="199" y="133" width="80" height="4" rx="2" fill="#d97757" opacity="0.75"/>
  <rect x="199" y="142" width="48" height="4" rx="2" fill="#6e6a8f"/>
  <rect x="252" y="141" width="6" height="8" fill="#d97757" class="cursor"/>
  <!-- Monitor stand -->
  <rect x="234" y="164" width="16" height="8" fill="#3a3756"/>

  <!-- Coffee mug -->
  <rect x="312" y="150" width="18" height="20" rx="3" fill="#e2e0f0"/>
  <path d="M330 155 C336 155 336 165 330 165" fill="none" stroke="#e2e0f0" stroke-width="2.5"/>
  <path d="M317 146 Q315 140 319 135" fill="none" stroke="#a6a2c4" stroke-width="1.5" stroke-linecap="round" class="steam1"/>
  <path d="M324 146 Q326 140 322 135" fill="none" stroke="#a6a2c4" stroke-width="1.5" stroke-linecap="round" class="steam2"/>

  <!-- Claude Desk -->
  <rect x="75" y="170" width="275" height="7" rx="3.5" fill="#3d3a5c"/>

  <!-- CENTER FLOATING VIBE PARTICLES -->
  <text x="388" y="88" fill="#f5c2e7" font-size="16" class="mono float1">✨</text>
  <text x="384" y="130" fill="#89b4fa" font-size="14" class="mono float2">&lt;/&gt;</text>

  <!-- RIGHT: CODEX SITTING AT DESK -->
  <!-- Chair back -->
  <rect x="462" y="102" width="12" height="58" rx="5" fill="#2c2942"/>
  <rect x="466" y="156" width="38" height="8" rx="4" fill="#2c2942"/>

  <!-- Codex mascot sitting -->
  <g class="codex-body">
    <!-- Legs sitting -->
    <rect x="498" y="150" width="22" height="10" rx="4" fill="#0d8265"/>
    <rect x="514" y="152" width="10" height="16" rx="4" fill="#0d8265"/>
    <!-- Bot body/head -->
    <rect x="482" y="96" width="44" height="44" rx="12" fill="#10a37f"/>
    <!-- Antenna -->
    <line x1="504" y1="96" x2="504" y2="85" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
    <circle cx="504" cy="83" r="4" fill="#38bdf8"/>
    <!-- Visor -->
    <rect x="490" y="108" width="32" height="14" rx="5" fill="#11101b"/>
    <circle cx="499" cy="115" r="3" fill="#38bdf8" class="eye-blink"/>
    <circle cx="513" cy="115" r="3" fill="#38bdf8" class="eye-blink"/>
    <!-- Arm reaching to keyboard -->
    <rect x="520" y="128" width="26" height="9" rx="4" fill="#1bc49a"/>
  </g>

  <!-- Codex Monitor -->
  <rect x="556" y="96" width="118" height="68" rx="7" fill="#252338" stroke="#10a37f" stroke-width="1.5"/>
  <rect x="562" y="102" width="106" height="56" rx="4" fill="#11101b"/>
  <text x="569" y="116" fill="#10a37f" font-size="10" font-weight="bold" class="mono">codex &gt;_</text>
  <rect x="569" y="124" width="75" height="4" rx="2" fill="#38bdf8" opacity="0.8"/>
  <rect x="569" y="133" width="54" height="4" rx="2" fill="#6e6a8f"/>
  <rect x="569" y="142" width="84" height="4" rx="2" fill="#10a37f" opacity="0.8"/>
  <rect x="658" y="141" width="6" height="8" fill="#10a37f" class="cursor"/>
  <!-- Monitor stand -->
  <rect x="607" y="164" width="16" height="8" fill="#3a3756"/>

  <!-- Codex Desk -->
  <rect x="445" y="170" width="275" height="7" rx="3.5" fill="#3d3a5c"/>

  <!-- Bottom status bar -->
  <circle cx="28" cy="200" r="4.5" fill="#27c93f" class="pulse"/>
  <text x="40" y="204" fill="#c5c2db" font-size="11.5" class="mono">vibe coding mode: ON</text>
  <text x="774" y="204" text-anchor="end" fill="#8b88a8" font-size="11.5" class="mono">assistants: Claude Code + Codex</text>
</svg>
