    <circle cx="78" cy="109" r="18" fill="url(#codexCloud)"/>
    <circle cx="61" cy="120" r="15" fill="url(#codexCloud)"/>
    <circle cx="95" cy="120" r="15" fill="url(#codexCloud)"/>
    <circle cx="63" cy="138" r="15" fill="url(#codexCloud)"/>
