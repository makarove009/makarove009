    <path d="M320 158 C331 148 336 96 350 96 C364 96 369 148 380 158 C383 161 376 165 370 160 C362 153 359 138 350 138 C341 138 338 153 330 160 C324 165 317 161 320 158 Z" fill="url(#agyLogo)"/>
  </g>
  <ellipse cx="350" cy="169" rx="20" ry="2.5" fill="#4285f4" opacity="0.45"/>

  <rect x="394" y="102" width="118" height="64" rx="7" fill="#252338" stroke="url(#agyLogo)" stroke-width="1.5"/>
  <rect x="400" y="108" width="106" height="52" rx="4" fill="#11101b"/>
  <text x="406" y="121" fill="#60a5fa" font-size="9.5" font-weight="bold" class="mono">antigravity &gt;_</text>
  <rect x="406" y="128" width="84" height="4" rx="2" fill="url(#agyLogo)"/>
  <rect x="406" y="137" width="56" height="4" rx="2" fill="#6e6a8f"/>
  <rect x="406" y="146" width="70" height="4" rx="2" fill="#34a853" opacity="0.85"/>
  <rect x="482" y="145" width="5.5" height="7" fill="#60a5fa" class="cursor"/>
  <rect x="446" y="166" width="14" height="6" fill="#3a3756"/>
  <rect x="308" y="172" width="222" height="6" rx="3" fill="#3d3a5c"/>

  <!-- ==================== 3. CLAUDE CODE (ACCURATE CLAWD) ==================== -->
  <text x="695" y="61" text-anchor="middle" fill="#fb923c" font-size="10.5" font-weight="bold" class="mono">CLAUDE CODE</text>

  <g class="clawd-body">
    <rect x="596" y="156" width="7" height="14" fill="#d95b26"/>
    <rect x="608" y="156" width="7" height="14" fill="#d95b26"/>
    <rect x="625" y="156" width="7" height="14" fill="#d95b26"/>
    <rect x="637" y="156" width="7" height="14" fill="#d95b26"/>
    <rect x="583" y="130" width="10" height="13" fill="#eb6b2c"/>
