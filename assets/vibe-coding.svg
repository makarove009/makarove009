  <rect x="44" y="48" width="76" height="19" rx="9.5" fill="#5b6cf9" opacity="0.22" stroke="#6d7cff" stroke-width="1"/>
  <text x="82" y="61" text-anchor="middle" fill="#93a3ff" font-size="10" font-weight="bold" class="mono">★ MAIN AI</text>

