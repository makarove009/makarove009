    <path d="M62 117 L72 125 L62 133" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="78" y1="135" x2="94" y2="135" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round"/>
  </g>

  <rect x="126" y="102" width="110" height="64" rx="7" fill="#252338" stroke="#6d7cff" stroke-width="1.5"/>
  <rect x="132" y="108" width="98" height="52" rx="4" fill="#11101b"/>
  <text x="138" y="121" fill="#818cf8" font-size="10" font-weight="bold" class="mono">codex &gt;_</text>
  <rect x="138" y="128" width="68" height="4" rx="2" fill="#818cf8" opacity="0.85"/>
  <rect x="138" y="137" width="48" height="4" rx="2" fill="#6e6a8f"/>
  <rect x="138" y="146" width="76" height="4" rx="2" fill="#38bdf8" opacity="0.85"/>
